name: Build APK

on:
  push:
    branches: [ main, dev ]
  # pull_request:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.38.5
        cache: true

    - name: Initialize Flutter SDK
      uses: chika3742/setup-fvm@v3
      with:
        project-dir: . # default
        cache: true # default

    - run: fvm flutter --version

    - name: Build
      run: fvm flutter clean && fvm flutter pub get && fvm flutter build windows --release

    # - name: Build APK
    #   run: flutter build apk --release

    # - name: Upload APK
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: beatza-${{ github.sha }}.apk
    #     path: build/app/outputs/flutter-apk/app-release.apk
    #     retention-days: 30

    - name: Upload Desktop folder
      uses: actions/upload-artifact@v4
      with:
        name: beatza-${{ github.sha }}
        path: build\windows\x64\runner\Release\
        retention-days: 30